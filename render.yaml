services:
  - type: web
    name: alex-prototype
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: "npm start"
    envVars:
      - key: AI_PROVIDER
        value: vertex
      - key: GOOGLE_CLOUD_LOCATION
        value: global
      - key: VERTEX_MODEL
        value: gemini-2.5-flash
